name: pkgdown

on:
  push:
    branches: [fall2026]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - id: setup-r
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Configure cacheable R library
        run: echo "R_LIBS_SITE=$RUNNER_TEMP/R-library" >> "$GITHUB_ENV"

      - name: Restore R package cache
        id: r-package-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/R-library
          key: r-packages-v2-ubuntu-noble-${{ steps.setup-r.outputs.installed-r-version }}-${{ hashFiles('DESCRIPTION') }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: false
          extra-packages: any::pkgdown
          install-quarto: false
          needs: website

      - name: Report R package cache status
        run: |
          echo "R package cache hit: ${{ steps.r-package-cache.outputs.cache-hit }}"

      - name: Install course package
        run: R CMD INSTALL .

      - name: Configure Git author
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build and deploy site
        run: pkgdown::deploy_to_branch(new_process = FALSE)
        shell: Rscript {0}

      - name: Add rendered class slides
        run: |
          git fetch origin gh-pages
          git worktree add --force .gh-pages gh-pages
          Rscript tools/copy-slide-assets.R .gh-pages
          git -C .gh-pages config user.name "github-actions[bot]"
          git -C .gh-pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .gh-pages add --all
          if git -C .gh-pages diff --cached --quiet; then exit 0; fi
          git -C .gh-pages commit -m "Deploy class slides"
          git -C .gh-pages push origin HEAD:gh-pages
